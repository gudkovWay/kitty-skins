  "Cyrillic_EM", "Cyrillic_EN", "Cyrillic_O", "Cyrillic_PE", "Cyrillic_ER",
  "Cyrillic_ES", "Cyrillic_TE", "Cyrillic_U", "Cyrillic_EF", "Cyrillic_HA",
